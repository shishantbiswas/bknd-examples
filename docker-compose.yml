services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      restart_policy:
        condition: on-failure
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    # env_file:
    #   - .env

  redis:
    image: 'redis:8-alpine'
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  redis_data: 
